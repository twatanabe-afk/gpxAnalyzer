<!DOCTYPE html>
<html lang="ja" class="h-full bg-slate-950 text-slate-100 select-none overflow-hidden">
<head>
  <meta charset="UTF-8">

  <title>GPX 最速ルート解析 &amp; タイムライン指定 (GPX Fastest Route Analyzer)</title>

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Leaflet CSS & JS -->

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* Safe Area Inset Utility Variables */
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.4); border-radius: 4px; }
    
    /* Leaflet Overrides */
    .leaflet-control-attribution {
      background: rgba(15, 23, 42, 0.75) !important;
      color: #94a3b8 !important;
      font-size: 9px !important;
      backdrop-filter: blur(4px);
    }
    .leaflet-control-attribution a { color: #38bdf8 !important; }
    .leaflet-container { background: #020617 !important; font-family: inherit; }

    /* Glassmorphism Classes */
    .glass-panel {
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    }
    .glass-btn {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.2s ease;
    }
    .glass-btn:active {
      transform: scale(0.95);
      background: rgba(51, 65, 85, 0.95);
    }

    /* Glow pulse effects */
    @keyframes glow-pulse {
      0% { box-shadow: 0 0 5px rgba(239, 68, 68, 0.6); }
      50% { box-shadow: 0 0 20px rgba(239, 68, 68, 0.9); }
      100% { box-shadow: 0 0 5px rgba(239, 68, 68, 0.6); }
    }
    .glow-gold { animation: glow-pulse 2s infinite; }

    @keyframes glow-emerald {
      0% { box-shadow: 0 0 5px rgba(16, 185, 129, 0.5); }
      50% { box-shadow: 0 0 18px rgba(16, 185, 129, 0.8); }
      100% { box-shadow: 0 0 5px rgba(16, 185, 129, 0.5); }
    }
    .glow-run { animation: glow-emerald 1.8s infinite; }
  </style>
</head>

<body class="h-full h-[100dvh] w-full relative flex flex-col font-sans overflow-hidden bg-slate-950">

  <!-- APPLICATION ENGINE -->
  <script>
    /* ==========================================================================
       1. GLOBAL STATE & CONFIG
       ========================================================================== */
    const CONFIG = {
      defaultCenter: [37.398, 140.388],
      defaultZoom: 13,
      cpRadius: 25,
    };

    const state = {
      rawRoutes: [],      // [{ id, name, date, points: [{lat, lng, timeSec, dist}], totalDist, pointCount }]
      analyzedRoutes: [], // Computed segment timing & gap results
      
      refTrackId: null,   // Selected reference GPX route ID
      startPointIndex: 0,
      goalPointIndex: 0,

      startCP: null,      // [lat, lng]
      goalCP: null,       // [lat, lng]
      
      selectedRouteId: null,
      showInvalid: false,
      sortBy: 'time',
      activeTab: 'ranking', // 'ranking' | 'files'
      isDirty: false
    };

    let map, baseLayers = {}, currentBaseLayer;
    let startMarker, goalMarker, startCircle, goalCircle;
    let routePolylines = {};

    /* ==========================================================================
       2. MAP INITIALIZATION
       ========================================================================== */
    function initMap() {
      map = L.map('map', {
        zoomControl: false,
        attributionControl: true
      }).setView(CONFIG.defaultCenter, CONFIG.defaultZoom);

      baseLayers.gsi_pale = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {
        maxZoom: 18,
        attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>'
      });
      baseLayers.osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
      });
      baseLayers.gsi_std = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
        maxZoom: 18,
        attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a>'
      });
      baseLayers.esri_sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 18,
        attribution: 'Tiles &copy; Esri'
      });

      currentBaseLayer = baseLayers.gsi_pale;
      currentBaseLayer.addTo(map);
    }

    /* ==========================================================================
       3. TIMELINE & CHECKPOINT ENGINE
       ========================================================================== */
    function getRefTrack() {
      if (!state.refTrackId || state.rawRoutes.length === 0) return null;
      return state.rawRoutes.find(r => r.id === state.refTrackId) || state.rawRoutes[0];
    }

    function updateRefTrackSelector() {
      const select = document.getElementById('select-ref-track');
      select.innerHTML = '';

      if (state.rawRoutes.length === 0) {
        select.innerHTML = `<option value="">ファイル未読み込み</option>`;
        state.refTrackId = null;
        return;
      }

      state.rawRoutes.forEach(r => {
        const opt = document.createElement('option');
        opt.value = r.id;
        opt.textContent = r.name;
        select.appendChild(opt);
      });

      if (!state.refTrackId || !state.rawRoutes.some(r => r.id === state.refTrackId)) {
        state.refTrackId = state.rawRoutes[0].id;
      }
      select.value = state.refTrackId;

      setupTimelineSliders();
    }

    function setupTimelineSliders() {
      const track = getRefTrack();
      if (!track || !track.points || track.points.length === 0) return;

      const maxIdx = track.points.length - 1;

      const startSlider = document.getElementById('slider-start-cp');
      const goalSlider = document.getElementById('slider-goal-cp');

      startSlider.max = maxIdx;
      goalSlider.max = maxIdx;

      state.startPointIndex = 0;
      state.goalPointIndex = maxIdx;

      startSlider.value = 0;
      goalSlider.value = maxIdx;

      updateCheckpointsFromTimeline(false);
      runAnalysis();
    }

    function updateCheckpointsFromTimeline(markDirty = true) {
      const track = getRefTrack();
      if (!track || !track.points || track.points.length === 0) return;

      const startSlider = document.getElementById('slider-start-cp');
      const goalSlider = document.getElementById('slider-goal-cp');

      let sIdx = parseInt(startSlider.value) || 0;
      let gIdx = parseInt(goalSlider.value) || (track.points.length - 1);

      if (sIdx > gIdx) {
        sIdx = gIdx;
        startSlider.value = sIdx;
      }

      state.startPointIndex = sIdx;
      state.goalPointIndex = gIdx;

      const startPt = track.points[sIdx];
      const goalPt = track.points[gIdx];

      state.startCP = [startPt.lat, startPt.lng];
      state.goalCP = [goalPt.lat, goalPt.lng];

      document.getElementById('timeline-start-readout').textContent = `${formatTimeMs(startPt.timeSec)} (${(startPt.dist / 1000).toFixed(2)}km)`;
      document.getElementById('timeline-goal-readout').textContent = `${formatTimeMs(goalPt.timeSec)} (${(goalPt.dist / 1000).toFixed(2)}km)`;

      renderCPMarkers();

      if (markDirty) {
        setDirtyState(true);
      }
    }

    function adjustCheckpointByTime(targetType, secondsDelta) {
      const track = getRefTrack();
      if (!track || !track.points || track.points.length === 0) return;

      const isStart = targetType === 'start';
      const currentIdx = isStart ? state.startPointIndex : state.goalPointIndex;
      const currentPt = track.points[currentIdx];
      const targetTime = currentPt.timeSec + secondsDelta;

      let bestIdx = currentIdx;
      let minDiff = Infinity;

      for (let i = 0; i < track.points.length; i++) {
        const diff = Math.abs(track.points[i].timeSec - targetTime);
        if (diff < minDiff) {
          minDiff = diff;
          bestIdx = i;
        }
      }

      const slider = document.getElementById(isStart ? 'slider-start-cp' : 'slider-goal-cp');
      slider.value = bestIdx;

      updateCheckpointsFromTimeline(true);
    }

    function setDirtyState(dirty) {
      state.isDirty = dirty;
      const badge = document.getElementById('pending-change-badge');
      if (dirty) {
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    function renderCPMarkers() {
      if (!state.startCP || !state.goalCP) return;

      if (startMarker) map.removeLayer(startMarker);
      if (startCircle) map.removeLayer(startCircle);
      if (goalMarker) map.removeLayer(goalMarker);
      if (goalCircle) map.removeLayer(goalCircle);

      // Start Marker
      const startHtml = `<div class="w-8 h-8 rounded-full bg-emerald-500 border-2 border-white text-slate-950 font-black text-xs shadow-xl flex items-center justify-center glow-gold">S</div>`;
      startMarker = L.marker(state.startCP, {
        icon: L.divIcon({ html: startHtml, className: '', iconSize: [32, 32], iconAnchor: [16, 16] })
      }).addTo(map);

      startCircle = L.circle(state.startCP, {
        radius: CONFIG.cpRadius,
        color: '#10b981',
        fillColor: '#10b981',
        fillOpacity: 0.25,
        weight: 2
      }).addTo(map);

      // Goal Marker
      const goalHtml = `<div class="w-8 h-8 rounded-full bg-red-600 border-2 border-white text-white font-black text-xs shadow-xl flex items-center justify-center"><i class="fa-solid fa-flag-checkered text-xs"></i></div>`;
      goalMarker = L.marker(state.goalCP, {
        icon: L.divIcon({ html: goalHtml, className: '', iconSize: [32, 32], iconAnchor: [16, 16] })
      }).addTo(map);

      goalCircle = L.circle(state.goalCP, {
        radius: CONFIG.cpRadius,
        color: '#ef4444',
        fillColor: '#ef4444',
        fillOpacity: 0.25,
        weight: 2
      }).addTo(map);
    }

    /* ==========================================================================
       4. FILE MANAGEMENT & BULK EXCLUSION ENGINE
       ========================================================================== */
    function removeSingleFile(routeId) {
      const idx = state.rawRoutes.findIndex(r => r.id === routeId);
      if (idx !== -1) {
        const removedName = state.rawRoutes[idx].name;
        state.rawRoutes.splice(idx, 1);
        
        updateRefTrackSelector();
        renderAllFileListViews();
        runAnalysis();
        toast(`ファイル「${removedName}」を除外しました`);
      }
    }

    function clearAllFiles() {
      state.rawRoutes = [];
      state.analyzedRoutes = [];
      state.refTrackId = null;
      state.startCP = null;
      state.goalCP = null;
      state.selectedRouteId = null;

      // Clear map markers & circles
      if (startMarker) { map.removeLayer(startMarker); startMarker = null; }
      if (startCircle) { map.removeLayer(startCircle); startCircle = null; }
      if (goalMarker) { map.removeLayer(goalMarker); goalMarker = null; }
      if (goalCircle) { map.removeLayer(goalCircle); goalCircle = null; }

      // Clear map polylines
      Object.values(routePolylines).forEach(pl => map.removeLayer(pl));
      routePolylines = {};

      // Reset controls & readouts
      document.getElementById('slider-start-cp').value = 0;
      document.getElementById('slider-goal-cp').value = 100;
      document.getElementById('timeline-start-readout').textContent = '00:00 (0.00km)';
      document.getElementById('timeline-goal-readout').textContent = '00:00 (0.00km)';
      
      updateRefTrackSelector();
      renderAllFileListViews();
      renderLeaderboard();
      setDirtyState(false);

      toast('すべてのファイルを一括除外しました');

    function parseMultipleFiles(files) {
      let readCount = 0;
      const totalFiles = files.length;

      Array.from(files).forEach((file, idx) => {
        const fname = file.name.toLowerCase();
        if (!fname.endsWith('.gpx') && !fname.endsWith('.kml') && !fname.endsWith('.kmz')) {
          readCount++;
          if (readCount === totalFiles) processLoadedRoutes();
          return;
        }

        const reader = new FileReader();
        reader.onload = (e) => {
          const parsed = parseSingleGPX(e.target.result, file.name, idx);
          if (parsed && parsed.points.length > 0) {
            state.rawRoutes.push(parsed);
          }
          readCount++;
          if (readCount === totalFiles) {
            processLoadedRoutes();
          }
        };
        reader.readAsText(file);
      });
    }

    function processLoadedRoutes() {
      if (state.rawRoutes.length === 0) return;
      updateRefTrackSelector();
      renderAllFileListViews();
      toast(`${state.rawRoutes.length} 個のファイルで解析を行いました`);
    }

    function parseSingleGPX(xmlText, fileName, fileIndex) {
      const parser = new DOMParser();
      const xml = parser.parseFromString(xmlText, "text/xml");
      const trkpts = xml.querySelectorAll('trkpt');

      if (!trkpts || trkpts.length === 0) return null;

      const points = [];
      let totalDist = 0;
      let firstTime = null;
      let dateString = "不明な日時";

      trkpts.forEach((pt, idx) => {
        const lat = parseFloat(pt.getAttribute('lat'));
        const lng = parseFloat(pt.getAttribute('lon'));
        
        const timeNode = pt.querySelector('time');
        let timestampMs = Date.now() + idx * 2000;
        if (timeNode) {
          const dt = new Date(timeNode.textContent);
          timestampMs = dt.getTime();
          if (idx === 0) {
            dateString = `${dt.getFullYear()}/${String(dt.getMonth()+1).padStart(2,'0')}/${String(dt.getDate()).padStart(2,'0')} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
          }
        }

        if (firstTime === null) firstTime = timestampMs;
        const timeSec = (timestampMs - firstTime) / 1000;

        if (idx > 0) {
          const prev = points[idx - 1];
          totalDist += getDistanceMeters([prev.lat, prev.lng], [lat, lng]);
        }

        points.push({ lat, lng, timeSec, timestampMs, dist: totalDist });
      });

      return {
        id: `route-${Date.now()}-${Math.random().toString(36).substr(2, 5)}`,
        name: fileName.replace(/\.[^/.]+$/, ""),
        date: dateString,
        firstTimestamp: points[0].timestampMs,
        points: points,
        pointCount: points.length,
        totalDist: totalDist
      };
    }

    /* ==========================================================================
       5. ANALYSIS & RANKING ENGINE
       ========================================================================== */
    function runAnalysis() {
      setDirtyState(false);

      if (state.rawRoutes.length === 0 || !state.startCP || !state.goalCP) {
        state.analyzedRoutes = [];
        renderMapPolylines();
        renderLeaderboard();
        return;
      }

      state.analyzedRoutes = [];

      state.rawRoutes.forEach(route => {
        const seg = calculateSegmentTime(route.points, state.startCP, state.goalCP, CONFIG.cpRadius);
        if (seg.valid) {
          state.analyzedRoutes.push({
            id: route.id,
            name: route.name,
            date: route.date,
            firstTimestamp: route.firstTimestamp,
            points: route.points,
            segmentSec: seg.durationSec,
            startTimeSec: seg.startTimeSec,
            endTimeSec: seg.endTimeSec,
            segmentDist: seg.distanceMeters,
            avgSpeed: (seg.distanceMeters / seg.durationSec) * 3.6,
            isValid: true
          });
        } else {
          state.analyzedRoutes.push({
            id: route.id,
            name: route.name,
            date: route.date,
            firstTimestamp: route.firstTimestamp,
            points: route.points,
            segmentSec: Infinity,
            isValid: false
          });
        }
      });

      const validRoutesSorted = state.analyzedRoutes.filter(r => r.isValid).sort((a,b) => a.segmentSec - b.segmentSec);
      const fastestTime = validRoutesSorted.length > 0 ? validRoutesSorted[0].segmentSec : null;

      state.analyzedRoutes.forEach(r => {
        if (r.isValid && fastestTime) {
          r.timeGapSec = r.segmentSec - fastestTime;
        } else {
          r.timeGapSec = null;
        }
      });

      sortAnalyzedRoutes();
      renderMapPolylines();
      renderLeaderboard();

      if (validRoutesSorted.length > 0 && !state.selectedRouteId) {
        selectRoute(validRoutesSorted[0].id);
      }

      toast('解析が完了しました！');
    }

    function calculateSegmentTime(points, startCP, goalCP, radiusMeters) {
      if (!startCP || !goalCP) return { valid: false };

      let startMatch = null;
      let goalMatch = null;

      for (let i = 0; i < points.length; i++) {
        const pt = points[i];
        const distStart = getDistanceMeters([pt.lat, pt.lng], startCP);
        
        if (!startMatch && distStart <= radiusMeters) {
          if (i > 0) {
            const prev = points[i-1];
            const prevDist = getDistanceMeters([prev.lat, prev.lng], startCP);
            const ratio = (prevDist - radiusMeters) / ((prevDist - distStart) || 1);
            const interpTime = prev.timeSec + Math.max(0, Math.min(1, ratio)) * (pt.timeSec - prev.timeSec);
            const interpDist = prev.dist + Math.max(0, Math.min(1, ratio)) * (pt.dist - prev.dist);
            startMatch = { timeSec: interpTime, dist: interpDist };
          } else {
            startMatch = { timeSec: pt.timeSec, dist: pt.dist };
          }
        }

        if (startMatch && !goalMatch) {
          const distGoal = getDistanceMeters([pt.lat, pt.lng], goalCP);
          if (distGoal <= radiusMeters) {
            if (i > 0) {
              const prev = points[i-1];
              const prevDist = getDistanceMeters([prev.lat, prev.lng], goalCP);
              const ratio = (prevDist - radiusMeters) / ((prevDist - distGoal) || 1);
              const interpTime = prev.timeSec + Math.max(0, Math.min(1, ratio)) * (pt.timeSec - prev.timeSec);
              const interpDist = prev.dist + Math.max(0, Math.min(1, ratio)) * (pt.dist - prev.dist);
              goalMatch = { timeSec: interpTime, dist: interpDist };
            } else {
              goalMatch = { timeSec: pt.timeSec, dist: pt.dist };
            }
          }
        }
      }

      if (startMatch && goalMatch && goalMatch.timeSec > startMatch.timeSec) {
        const durationSec = goalMatch.timeSec - startMatch.timeSec;
        const distanceMeters = Math.max(10, goalMatch.dist - startMatch.dist);
        return {
          valid: true,
          durationSec,
          startTimeSec: startMatch.timeSec,
          endTimeSec: goalMatch.timeSec,
          distanceMeters
        };
      }

      return { valid: false };
    }

    function sortAnalyzedRoutes() {
      state.analyzedRoutes.sort((a, b) => {
        if (a.isValid !== b.isValid) return a.isValid ? -1 : 1;
        
        if (state.sortBy === 'time') return a.segmentSec - b.segmentSec;
        if (state.sortBy === 'date_new') return b.firstTimestamp - a.firstTimestamp;
        if (state.sortBy === 'date_old') return a.firstTimestamp - b.firstTimestamp;
        if (state.sortBy === 'speed') return b.avgSpeed - a.avgSpeed;
        return 0;
      });
    }

    /* ==========================================================================
       6. MAP & LEADERBOARD RENDERING
       ========================================================================== */
    function renderMapPolylines() {
      Object.values(routePolylines).forEach(pl => map.removeLayer(pl));
      routePolylines = {};

      const bounds = L.latLngBounds();
      const fastest = state.analyzedRoutes.find(r => r.isValid);

      state.analyzedRoutes.forEach((route) => {
        if (!route.isValid && !state.showInvalid) return;

        const isFastest = fastest && route.id === fastest.id;
        const coords = route.points.map(p => [p.lat, p.lng]);
        coords.forEach(c => bounds.extend(c));

        // Rank #1 line styling: Crimson Red (#ef4444) and extra thick (weight: 9)
        let style = {
          color: isFastest ? '#ef4444' : '#38bdf8',
          weight: isFastest ? 9 : 3,
          opacity: isFastest ? 1.0 : 0.45,
          dashArray: route.isValid ? null : '6, 6'
        };

        const polyline = L.polyline(coords, style).addTo(map);
        polyline.on('click', () => selectRoute(route.id));
        routePolylines[route.id] = polyline;

        if (isFastest) {
          polyline.bringToFront();
        }
      });

      if (bounds.isValid()) {
        map.fitBounds(bounds, { padding: [50, 50] });
      }
    }

    function selectRoute(routeId) {
      state.selectedRouteId = routeId;
      const fastest = state.analyzedRoutes.find(r => r.isValid);

      state.analyzedRoutes.forEach((route) => {
        const pl = routePolylines[route.id];
        if (!pl) return;

        const isSelected = route.id === routeId;
        const isFastest = fastest && route.id === fastest.id;

        if (isSelected) {
          pl.setStyle({ 
            color: isFastest ? '#ef4444' : '#06b6d4', 
            weight: isFastest ? 10 : 7, 
            opacity: 1.0 
          });
          pl.bringToFront();
        } else {
          pl.setStyle({ 
            color: isFastest ? '#ef4444' : '#64748b', 
            weight: isFastest ? 9 : 3, 
            opacity: isFastest ? 0.95 : 0.3 
          });
        }
      });

      document.querySelectorAll('.lb-card').forEach(card => {
        if (card.getAttribute('data-id') === routeId) {
          card.classList.add('border-cyan-400', 'bg-slate-800/90');
          card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        } else {
          card.classList.remove('border-cyan-400', 'bg-slate-800/90');
        }
      });
    }

    function renderLeaderboard() {
      const container = document.getElementById('leaderboard-list');
      container.innerHTML = '';

      const validRoutes = state.analyzedRoutes.filter(r => r.isValid);
      document.getElementById('badge-valid-count').textContent = `${validRoutes.length} / ${state.rawRoutes.length} 適合`;
      document.getElementById('lb-summary').textContent = `${validRoutes.length} 件適合 (全 ${state.rawRoutes.length} 件)`;

      if (state.analyzedRoutes.length === 0) {
        container.innerHTML = `<div class="p-6 text-center text-slate-500 text-xs bg-slate-900/40 rounded-xl border border-slate-800/60">右上の「読込」からGPXを読み込んでください</div>`;
        return;
      }

      const fastestRoute = validRoutes.length > 0 ? validRoutes.reduce((prev, curr) => curr.segmentSec < prev.segmentSec ? curr : prev) : null;

      state.analyzedRoutes.forEach((route, index) => {
        if (!route.isValid && !state.showInvalid) return;

        const card = document.createElement('div');
        const isFastest = fastestRoute && route.id === fastestRoute.id;

        card.className = `lb-card p-2 rounded-xl border transition cursor-pointer flex flex-col gap-1 ${
          isFastest 
            ? 'bg-red-950/40 border-red-500/60 shadow-lg' 
            : 'bg-slate-900/70 border-slate-800 hover:border-slate-700'
        }`;
        card.setAttribute('data-id', route.id);
        card.onclick = () => selectRoute(route.id);

        let badgeHtml = '';
        if (isFastest) {
          badgeHtml = `<span class="bg-gradient-to-r from-red-600 to-rose-500 text-white font-black px-1.5 py-0.2 rounded text-[9px] flex items-center gap-1 shadow"><i class="fa-solid fa-crown text-yellow-300"></i> 最速 #1</span>`;
        } else if (route.isValid) {
          badgeHtml = `<span class="bg-slate-800 text-slate-300 font-bold px-1.5 py-0.2 rounded text-[9px]">Rank ${index + 1}</span>`;
        } else {
          badgeHtml = `<span class="bg-red-950 text-red-400 border border-red-800 px-1.5 py-0.2 rounded text-[9px]">区間未通過</span>`;
        }

        const timeDisplay = route.isValid ? formatTimeMs(route.segmentSec) : '--:--';
        const gapDisplay = (route.isValid && route.timeGapSec > 0) ? `+${formatTimeMs(route.timeGapSec)}` : (isFastest ? 'チャンピオン' : '--');
        const distDisplay = route.isValid ? `${(route.segmentDist / 1000).toFixed(2)} km` : '-- km';
        const avgSpeedDisplay = route.isValid ? `${route.avgSpeed.toFixed(1)} km/h` : '--';

        card.innerHTML = `
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-1.5 overflow-hidden">
              ${badgeHtml}
              <span class="font-bold text-xs text-slate-100 truncate max-w-[160px]">${route.name}</span>
            </div>
            <div class="text-right flex items-center gap-2">
              <span class="font-mono font-black text-xs ${isFastest ? 'text-red-400' : 'text-cyan-400'}">${timeDisplay}</span>
              <span class="text-[9px] font-mono text-slate-400">${gapDisplay}</span>
            </div>
          </div>

          <div class="grid grid-cols-3 gap-1 text-[9px] text-slate-400 bg-slate-950/50 p-1 rounded font-mono">
            <div><i class="fa-regular fa-calendar text-slate-500 mr-1"></i>${route.date}</div>
            <div><i class="fa-solid fa-ruler-horizontal text-slate-500 mr-1"></i>${distDisplay}</div>
            <div><i class="fa-solid fa-gauge-high text-slate-500 mr-1"></i>${avgSpeedDisplay}</div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    /* ==========================================================================
       7. CSV EXPORT & UTILITIES
       ========================================================================== */
    function exportResultsCSV() {
      const validRoutes = state.analyzedRoutes.filter(r => r.isValid);
      if (validRoutes.length === 0) {
        alert('出力可能な解析結果がありません');
        return;
      }

      let csv = '順位,トラック名,記録日時,区間タイム(秒),タイム差(+s),距離(km),平均速度(km/h)\n';
      validRoutes.forEach((r, idx) => {
        const gap = r.timeGapSec !== null ? r.timeGapSec.toFixed(2) : '0.00';
        csv += `${idx + 1},"${r.name}","${r.date}",${r.segmentSec.toFixed(2)},+${gap},${(r.segmentDist/1000).toFixed(3)},${r.avgSpeed.toFixed(2)}\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `GPX_Fastest_Route_Results_${new Date().toISOString().slice(0,10)}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      toast('CSVファイルをダウンロードしました');
    }

    function getDistanceMeters(p1, p2) {
      const R = 6371000;
      const dLat = (p2[0] - p1[0]) * Math.PI / 180;
      const dLng = (p2[1] - p1[1]) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(p1[0] * Math.PI / 180) * Math.cos(p2[0] * Math.PI / 180) *
                Math.sin(dLng / 2) * Math.sin(dLng / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function formatTimeMs(totalSeconds) {
      if (isNaN(totalSeconds) || totalSeconds === Infinity) return '--:--';
      const mins = Math.floor(totalSeconds / 60);
      const secs = Math.floor(totalSeconds % 60);
      const ms = Math.floor((totalSeconds % 1) * 10);
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}.${ms}`;
    }

    function toast(msg) {
      const t = document.createElement('div');
      t.className = 'fixed bottom-16 left-1/2 -translate-x-1/2 z-50 bg-slate-900/95 text-cyan-300 border border-cyan-500/40 text-xs font-bold px-3.5 py-1.5 rounded-xl shadow-2xl backdrop-blur-md transition-all duration-300 opacity-0 transform translate-y-2';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.classList.remove('opacity-0', 'translate-y-2'), 10);
      setTimeout(() => {
        t.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => document.body.removeChild(t), 300);
      }, 2200);
    }

    /* ==========================================================================
       8. EVENT LISTENERS & INITIALIZATION
       ========================================================================== */
    window.addEventListener('DOMContentLoaded', () => {
      initMap();

      // File Inputs
      const gpxInput = document.getElementById('gpx-files-input');
      const gpxModalInput = document.getElementById('gpx-modal-add-input');
      
      const handleFileSelect = (e) => {
        if (e.target.files && e.target.files.length > 0) {
          parseMultipleFiles(e.target.files);
          e.target.value = '';
        }
      };

      gpxInput.addEventListener('change', handleFileSelect);
      gpxModalInput.addEventListener('change', handleFileSelect);

      // Reference Track Selector
      document.getElementById('select-ref-track').addEventListener('change', (e) => {
        state.refTrackId = e.target.value;
        setupTimelineSliders();
      });

      // Timeline Sliders & Fine-Tuning Buttons
      document.getElementById('slider-start-cp').addEventListener('input', () => updateCheckpointsFromTimeline(true));
      document.getElementById('slider-goal-cp').addEventListener('input', () => updateCheckpointsFromTimeline(true));

      document.getElementById('btn-s-minus-5').addEventListener('click', () => adjustCheckpointByTime('start', -5));
      document.getElementById('btn-s-plus-5').addEventListener('click', () => adjustCheckpointByTime('start', 5));
      document.getElementById('btn-g-minus-5').addEventListener('click', () => adjustCheckpointByTime('goal', -5));
      document.getElementById('btn-g-plus-5').addEventListener('click', () => adjustCheckpointByTime('goal', 5));

      // Explicit Manual Run Analysis Button
      document.getElementById('btn-run-analysis').addEventListener('click', runAnalysis);

      // Sorting
      document.getElementById('select-sort').addEventListener('change', (e) => {
        state.sortBy = e.target.value;
        sortAnalyzedRoutes();
        renderLeaderboard();
      });

      // Tab Switching
      const tabBtnRanking = document.getElementById('tab-btn-ranking');
      const tabBtnFiles = document.getElementById('tab-btn-files');
      const tabContentRanking = document.getElementById('tab-content-ranking');
      const tabContentFiles = document.getElementById('tab-content-files');

      tabBtnRanking.addEventListener('click', () => {
        state.activeTab = 'ranking';
        tabBtnRanking.className = 'px-2.5 py-0.5 rounded-md text-xs font-bold transition bg-cyan-950 text-cyan-300 border border-cyan-500/40';
        tabBtnFiles.className = 'px-2.5 py-0.5 rounded-md text-xs font-bold transition text-slate-400 hover:text-slate-200';
        tabContentRanking.classList.remove('hidden');
        tabContentFiles.classList.add('hidden');
      });

      tabBtnFiles.addEventListener('click', () => {
        state.activeTab = 'files';
        tabBtnFiles.className = 'px-2.5 py-0.5 rounded-md text-xs font-bold transition bg-cyan-950 text-cyan-300 border border-cyan-500/40';
        tabBtnRanking.className = 'px-2.5 py-0.5 rounded-md text-xs font-bold transition text-slate-400 hover:text-slate-200';
        tabContentFiles.classList.remove('hidden');
        tabContentRanking.classList.add('hidden');
      });

      // Panel Collapse Toggle
      let panelOpen = true;
      document.getElementById('btn-toggle-panel').addEventListener('click', () => {
        panelOpen = !panelOpen;
        const body = document.getElementById('panel-body');
        const icon = document.getElementById('panel-toggle-icon');
        if (panelOpen) {
          body.classList.remove('hidden');
          icon.className = 'fa-solid fa-chevron-down text-[10px]';
        } else {
          body.classList.add('hidden');
          icon.className = 'fa-solid fa-chevron-up text-[10px]';
        }
      });

      // File Manager Modal Controls
      const fileMgrModal = document.getElementById('file-manager-modal');
      document.getElementById('btn-open-file-manager').addEventListener('click', () => {
        renderModalFileList();
        fileMgrModal.classList.remove('hidden');
      });
      document.getElementById('btn-close-file-manager').addEventListener('click', () => fileMgrModal.classList.add('hidden'));
      document.getElementById('btn-close-file-manager-bottom').addEventListener('click', () => fileMgrModal.classList.add('hidden'));
      document.getElementById('btn-modal-clear-all').addEventListener('click', () => {
        if (confirm('すべてのGPXファイルを一括除外しますか？')) {
          clearAllFiles();
          fileMgrModal.classList.add('hidden');
        }
      });

      // Footer Actions
      document.getElementById('btn-export-csv').addEventListener('click', exportResultsCSV);
      document.getElementById('btn-clear-all').addEventListener('click', () => {
        if (confirm('すべてのGPXファイルを一括除外しますか？')) {
          clearAllFiles();
        }
      });

      // Settings Modal
      const settingsModal = document.getElementById('settings-modal');
      document.getElementById('btn-settings').addEventListener('click', () => settingsModal.classList.remove('hidden'));
      document.getElementById('btn-close-settings').addEventListener('click', () => settingsModal.classList.add('hidden'));

      document.getElementById('input-cp-radius-slider').addEventListener('input', (e) => {
        CONFIG.cpRadius = parseInt(e.target.value);
        document.getElementById('radius-val-display').textContent = `${CONFIG.cpRadius} m`;
        renderCPMarkers();
        setDirtyState(true);
      });

      document.getElementById('chk-show-invalid').addEventListener('change', (e) => {
        state.showInvalid = e.target.checked;
        renderMapPolylines();
        renderLeaderboard();
      });

      // Tile Switcher Modal
      const tileModal = document.getElementById('tile-modal');
      document.getElementById('btn-tile-switch').addEventListener('click', () => tileModal.classList.toggle('hidden'));

      document.querySelectorAll('.tile-opt').forEach(btn => {
        btn.addEventListener('click', () => {
          const tileKey = btn.getAttribute('data-tile');
          if (baseLayers[tileKey]) {
            map.removeLayer(currentBaseLayer);
            currentBaseLayer = baseLayers[tileKey];
            currentBaseLayer.addTo(map);

            document.querySelectorAll('.check-icon').forEach(icon => icon.classList.add('hidden'));
            btn.querySelector('.check-icon').classList.remove('hidden');
            tileModal.classList.add('hidden');
          }
        });
      });

      // Map Zoom Controls
      document.getElementById('btn-zoom-in').addEventListener('click', () => map.zoomIn());
      document.getElementById('btn-zoom-out').addEventListener('click', () => map.zoomOut());

      // Initialize UI state
      updateRefTrackSelector();
      renderAllFileListViews();
    });
  </script>
</body>
